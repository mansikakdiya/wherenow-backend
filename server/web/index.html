<!DOCTYPE html>

<html>

<head>
    <title>Location Request</title>
</head>

<body>
<h2>Location Sharing Request</h2>

<p>Someone wants you to share your location.</p>

<button onclick="acceptLocation()">
    Accept & Share Location
</button>

<!-- Socket.IO client -->
<script src="/socket.io/socket.io.js"></script>

<script>

    // ==============================
    // Get Request ID from URL
    // ==============================

    const requestId =
        new URLSearchParams(window.location.search)
            .get("requestId");

    console.log("Request ID:", requestId);


    // ==============================
    // Connect to Socket.IO
    // ==============================

    const socket =
        io("https://wherenow-backend-gfvd.onrender.com");


    // ==============================
    // Socket Connected
    // ==============================

    socket.on("connect", () => {

        console.log(
            "Connected to Socket.IO:",
            socket.id
        );


        // Join request room
        socket.emit(
            "join-request",
            requestId
        );


        console.log(
            "Joined request:",
            requestId
        );

    });


    // ==============================
    // Socket Connection Error
    // ==============================

    socket.on("connect_error", (error) => {

        console.error(
            "Socket connection error:",
            error
        );

    });


    // ==============================
    // Socket Disconnected
    // ==============================

    socket.on("disconnect", () => {

        console.log(
            "Socket disconnected"
        );

    });


    // ==============================
    // Accept Location
    // ==============================

    function acceptLocation() {

        if (!navigator.geolocation) {

            alert(
                "Location is not supported on this device."
            );

            return;
        }


        navigator.geolocation.getCurrentPosition(

            function (position) {

                const latitude =
                    position.coords.latitude;

                const longitude =
                    position.coords.longitude;


                console.log(
                    "Latitude:",
                    latitude
                );

                console.log(
                    "Longitude:",
                    longitude
                );


                // ==============================
                // Send Location to Backend
                // ==============================

                fetch(
                    "https://wherenow-backend-gfvd.onrender.com/location",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            requestId: requestId,

                            latitude: latitude,

                            longitude: longitude

                        })

                    }
                )

                .then(response => {

                    return response.json();

                })

                .then(data => {

                    console.log(
                        "Server response:",
                        data
                    );


                    // ==============================
                    // Open Google Maps
                    // ==============================

                    const googleMapsUrl =
                        `https://www.google.com/maps?q=${latitude},${longitude}`;


                    window.location.href =
                        googleMapsUrl;

                })

                .catch(error => {

                    console.error(
                        "Error sending location:",
                        error
                    );

                });

            },


            function (error) {

                alert(
                    "Please allow location access."
                );


                console.error(
                    "Location error:",
                    error
                );

            }

        );

    }

</script>


</body>

</html>
