<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WhereNow - Share Location</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #222;
        }

        .container {
            max-width: 420px;
            margin: auto;
            padding: 24px 18px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .status {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 10px;
            background: #f0f0f0;
            font-size: 14px;
        }

        .location {
            margin-top: 18px;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 12px;
        }

        .location p {
            margin: 7px 0;
            font-size: 14px;
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
        }

        #shareButton {
            background: #222;
            color: white;
        }

        #stopButton {
            background: #e74c3c;
            color: white;
            display: none;
        }

        .error {
            color: #d33;
            margin-top: 15px;
            font-size: 14px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>WhereNow</h1>

    <div class="subtitle">
        Someone is requesting your location.
    </div>


    <div class="card">

        <div
            id="status"
            class="status"
        >
            Connecting...
        </div>


        <button
            id="shareButton"
            onclick="startSharing()"
        >
            Allow & Share Location
        </button>


        <button
            id="stopButton"
            onclick="stopSharing()"
        >
            Stop Sharing
        </button>


        <div
            id="locationCard"
            class="location"
            style="display:none;"
        >

            <p>
                <strong>Latitude:</strong>
                <span id="latitude">-</span>
            </p>

            <p>
                <strong>Longitude:</strong>
                <span id="longitude">-</span>
            </p>

            <p>
                <strong>Last updated:</strong>
                <span id="updatedAt">-</span>
            </p>

        </div>


        <div
            id="error"
            class="error"
        ></div>

    </div>

</div>


<script>

    // ========================================
    // Setup
    // ========================================

    const params =
        new URLSearchParams(
            window.location.search
        );

    const requestId =
        params.get("requestId");


    const socket =
        io(window.location.origin);


    let watchId = null;


    const statusElement =
        document.getElementById("status");

    const shareButton =
        document.getElementById("shareButton");

    const stopButton =
        document.getElementById("stopButton");

    const locationCard =
        document.getElementById("locationCard");

    const errorElement =
        document.getElementById("error");


    // ========================================
    // Validate request ID
    // ========================================

    if (!requestId) {

        statusElement.innerText =
            "Invalid location request.";

        shareButton.style.display =
            "none";
    }


    // ========================================
    // Socket Connected
    // ========================================

    socket.on(
        "connect",
        () => {

            console.log(
                "Connected:",
                socket.id
            );


            socket.emit(
                "join-request",
                {
                    requestId,
                    role: "sharer",
                }
            );
        }
    );


    // ========================================
    // Request Status
    // ========================================

    socket.on(
        "request-status",
        (data) => {

            console.log(
                "Request status:",
                data
            );


            if (
                data.status ===
                "pending"
            ) {

                statusElement.innerText =
                    "Waiting for you to share your location.";
            }


            if (
                data.status ===
                "active"
            ) {

                statusElement.innerText =
                    "Location is being shared.";
            }


            if (
                data.status ===
                "stopped"
            ) {

                statusElement.innerText =
                    "Location sharing is stopped.";
            }


            if (
                data.status ===
                "disconnected"
            ) {

                statusElement.innerText =
                    "Location sharing disconnected.";
            }
        }
    );


    // ========================================
    // Start Sharing
    // ========================================

    function startSharing() {

        errorElement.innerText = "";


        if (
            !navigator.geolocation
        ) {

            errorElement.innerText =
                "Your browser does not support location.";

            return;
        }


        statusElement.innerText =
            "Requesting location permission...";


        watchId =
            navigator.geolocation.watchPosition(

                (position) => {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;


                    document.getElementById(
                        "latitude"
                    ).innerText =
                        latitude.toFixed(6);


                    document.getElementById(
                        "longitude"
                    ).innerText =
                        longitude.toFixed(6);


                    document.getElementById(
                        "updatedAt"
                    ).innerText =
                        new Date().toLocaleTimeString();


                    locationCard.style.display =
                        "block";


                    statusElement.innerText =
                        "📍 Your location is being shared";


                    shareButton.style.display =
                        "none";


                    stopButton.style.display =
                        "block";


                    socket.emit(
                        "location-update",
                        {

                            requestId,

                            latitude,

                            longitude,
                        }
                    );
                },


                (error) => {

                    console.error(
                        error
                    );


                    statusElement.innerText =
                        "Location permission failed.";

                    shareButton.style.display =
                        "block";

                    stopButton.style.display =
                        "none";


                    errorElement.innerText =
                        error.message;
                },


                {
                    enableHighAccuracy: true,

                    maximumAge: 5000,

                    timeout: 10000,
                }
            );


        socket.emit(
            "start-sharing",
            {
                requestId,
            }
        );
    }


    // ========================================
    // Stop Sharing
    // ========================================

    function stopSharing() {

        if (
            watchId !== null
        ) {

            navigator.geolocation.clearWatch(
                watchId
            );

            watchId = null;
        }


        socket.emit(
            "stop-sharing",
            {
                requestId,
            }
        );


        statusElement.innerText =
            "Location sharing stopped.";


        shareButton.style.display =
            "block";

        stopButton.style.display =
            "none";
    }


    // ========================================
    // Backend says stopped
    // ========================================

    socket.on(
        "sharing-stopped",
        (data) => {

            statusElement.innerText =
                "Location sharing stopped.";

            shareButton.style.display =
                "block";

            stopButton.style.display =
                "none";
        }
    );


    // ========================================
    // Backend says disconnected
    // ========================================

    socket.on(
        "sharing-disconnected",
        () => {

            statusElement.innerText =
                "Location sharing disconnected.";

            shareButton.style.display =
                "block";

            stopButton.style.display =
                "none";
        }
    );


    // ========================================
    // Request Error
    // ========================================

    socket.on(
        "request-error",
        (data) => {

            errorElement.innerText =
                data.message;
        }
    );

</script>

</body>

</html>
