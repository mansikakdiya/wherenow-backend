<!DOCTYPE html>

<html>

<head>

    <title>WhereNow - Share Location</title>

</head>


<body>

    <h2>WhereNow</h2>

    <p>
        Someone wants you to share your location.
    </p>

    <button onclick="acceptLocation()">
        Accept & Share Location
    </button>


    <p id="status">
        Connecting...
    </p>


    <!-- Socket.IO -->

    <script src="/socket.io/socket.io.js"></script>


    <script>

        // ========================================
        // Request ID
        // ========================================

        const requestId =
            new URLSearchParams(
                window.location.search
            ).get("requestId");


        console.log(
            "Request ID:",
            requestId
        );


        // ========================================
        // Status UI
        // ========================================

        const statusElement =
            document.getElementById("status");


        // ========================================
        // Socket Connection
        // ========================================

        const socket =
            io("https://wherenow-backend-gfvd.onrender.com");


        // ========================================
        // Connected
        // ========================================

        socket.on(
            "connect",
            () => {

                console.log(
                    "Socket connected:",
                    socket.id
                );


                statusElement.innerText =
                    "Connected";


                // Join request room

                socket.emit(
                    "join-request",
                    requestId
                );

            }
        );


        // ========================================
        // Request Status
        // ========================================

        socket.on(
            "request-status",
            (data) => {

                console.log(
                    "Request status:",
                    data
                );

            }
        );


        // ========================================
        // Request Error
        // ========================================

        socket.on(
            "request-error",
            (data) => {

                console.error(
                    "Request error:",
                    data
                );


                statusElement.innerText =
                    data.message;

            }
        );


        // ========================================
        // Socket Error
        // ========================================

        socket.on(
            "connect_error",
            (error) => {

                console.error(
                    "Socket connection error:",
                    error
                );


                statusElement.innerText =
                    "Connection failed";

            }
        );


        // ========================================
        // Disconnect
        // ========================================

        socket.on(
            "disconnect",
            () => {

                console.log(
                    "Socket disconnected"
                );


                statusElement.innerText =
                    "Disconnected";

            }
        );


        // ========================================
        // ACCEPT LOCATION
        // ========================================

        function acceptLocation() {

            if (!navigator.geolocation) {

                alert(
                    "Location is not supported."
                );

                return;

            }


            statusElement.innerText =
                "Getting your location...";


            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const latitude =
                        position.coords.latitude;


                    const longitude =
                        position.coords.longitude;


                    console.log(
                        "Latitude:",
                        latitude
                    );


                    console.log(
                        "Longitude:",
                        longitude
                    );


                    // ========================================
                    // Send first location using Socket.IO
                    // ========================================

                    socket.emit(
                        "location-update",
                        {

                            requestId:

                                requestId,

                            latitude:

                                latitude,

                            longitude:

                                longitude

                        }
                    );


                    statusElement.innerText =
                        "Location shared successfully.";

                },


                function(error) {

                    console.error(
                        "Location error:",
                        error
                    );


                    alert(
                        "Please allow location access."
                    );

                }

            );

        }

    </script>

</body>

</html>
