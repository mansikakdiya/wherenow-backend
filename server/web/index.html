
<!DOCTYPE html>

<html>

<head>

    <title>WhereNow - Share Location</title>

</head>


<body>

    <h2>WhereNow</h2>


    <p>
        Someone wants you to share your location.
    </p>


    <button
        id="shareButton"
        onclick="acceptLocation()"
    >
        Accept & Share Location
    </button>


    <p id="status">
        Connecting...
    </p>


    <script src="/socket.io/socket.io.js"></script>


    <script>

        // ========================================
        // Request ID
        // ========================================

        const requestId =
            new URLSearchParams(
                window.location.search
            ).get("requestId");


        console.log(
            "Request ID:",
            requestId
        );


        // ========================================
        // Status
        // ========================================

        const statusElement =
            document.getElementById(
                "status"
            );


        const shareButton =
            document.getElementById(
                "shareButton"
            );


        // ========================================
        // Socket.IO
        // ========================================

        const socket =
            io(window.location.origin);


        // ========================================
        // Connected
        // ========================================

        socket.on(
            "connect",
            () => {

                console.log(
                    "Socket connected:",
                    socket.id
                );


                statusElement.innerText =
                    "Connected";


                socket.emit(
                    "join-request",
                    requestId
                );


                console.log(
                    "Joined request:",
                    requestId
                );

            }
        );


        // ========================================
        // Request Status
        // ========================================

        socket.on(
            "request-status",
            (data) => {

                console.log(
                    "Request status:",
                    data
                );

            }
        );


        // ========================================
        // Request Error
        // ========================================

        socket.on(
            "request-error",
            (data) => {

                console.error(
                    "Request error:",
                    data
                );


                statusElement.innerText =
                    data.message;

            }
        );


        // ========================================
        // Socket Error
        // ========================================

        socket.on(
            "connect_error",
            (error) => {

                console.error(
                    "Socket connection error:",
                    error
                );


                statusElement.innerText =
                    "Connection failed";

            }
        );


        // ========================================
        // Accept Location
        // ========================================

        function acceptLocation() {

            if (!requestId) {

                statusElement.innerText =
                    "Invalid location request.";

                return;

            }


            if (!navigator.geolocation) {

                statusElement.innerText =
                    "Location is not supported.";

                return;

            }


            statusElement.innerText =
                "Starting live location...";


            shareButton.disabled =
                true;


            // ========================================
            // Watch GPS continuously
            // ========================================

            navigator.geolocation.watchPosition(

                function(position) {

                    const latitude =
                        position.coords.latitude;


                    const longitude =
                        position.coords.longitude;


                    console.log(
                        "Live GPS:",
                        latitude,
                        longitude
                    );


                    // ========================================
                    // Send location to backend
                    // ========================================

                    socket.emit(
                        "location-update",
                        {

                            requestId:
                                requestId,

                            latitude:
                                latitude,

                            longitude:
                                longitude

                        }
                    );


                    statusElement.innerText =
                        "Location sharing is active.";

                },


                function(error) {

                    console.error(
                        "Location error:",
                        error
                    );


                    shareButton.disabled =
                        false;


                    statusElement.innerText =
                        "Please allow location access.";

                },


                {

                    enableHighAccuracy:
                        true,

                    maximumAge:
                        0,

                    timeout:
                        10000

                }

            );

        }

    </script>

</body>

</html>
