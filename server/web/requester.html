<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WhereNow - Request Location</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #222;
        }

        .container {
            max-width: 420px;
            margin: auto;
            padding: 24px 18px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .share-url {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 10px;
            word-break: break-all;
            font-size: 13px;
            margin-top: 12px;
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
        }

        #requestButton {
            background: #222;
            color: white;
        }

        #copyButton {
            background: #eee;
            color: #222;
        }

        #mapsButton {
            background: #4285f4;
            color: white;
        }

        .status {
            padding: 12px;
            border-radius: 10px;
            background: #f0f0f0;
            font-size: 14px;
        }

        .location {
            margin-top: 16px;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 12px;
        }

        .location p {
            margin: 7px 0;
            font-size: 14px;
        }

        .error {
            color: #d33;
            margin-top: 12px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>WhereNow</h1>

    <div class="subtitle">
        Request someone's live location.
    </div>


    <!-- Request -->

    <div class="card">

        <button
            id="requestButton"
            onclick="createRequest()"
        >
            Request Location
        </button>

    </div>


    <!-- Share Link -->

    <div
        id="shareCard"
        class="card"
        style="display:none;"
    >

        <strong>
            Send this link to the person:
        </strong>

        <div
            id="shareUrl"
            class="share-url"
        ></div>


        <button
            id="copyButton"
            onclick="copyLink()"
        >
            Copy Link
        </button>

    </div>


    <!-- Status -->

    <div
        id="locationCard"
        class="card"
        style="display:none;"
    >

        <div
            id="status"
            class="status"
        >
            Waiting...
        </div>


        <div
            id="locationInfo"
            class="location"
            style="display:none;"
        >

            <p>
                <strong>Latitude:</strong>
                <span id="latitude">-</span>
            </p>

            <p>
                <strong>Longitude:</strong>
                <span id="longitude">-</span>
            </p>

            <p>
                <strong>Updated:</strong>
                <span id="updatedAt">-</span>
            </p>

        </div>


        <button
            id="mapsButton"
            onclick="openGoogleMaps()"
            style="display:none;"
        >
            Open Route in Google Maps
        </button>

    </div>


    <div
        id="error"
        class="error"
    ></div>

</div>


<script>

    const BASE_URL =
        window.location.origin;


    const socket =
        io(window.location.origin);


    let requestId = null;

    let latestLocation = null;

    let requesterLocation = null;


    const shareCard =
        document.getElementById(
            "shareCard"
        );

    const shareUrlElement =
        document.getElementById(
            "shareUrl"
        );

    const locationCard =
        document.getElementById(
            "locationCard"
        );

    const statusElement =
        document.getElementById(
            "status"
        );

    const locationInfo =
        document.getElementById(
            "locationInfo"
        );

    const mapsButton =
        document.getElementById(
            "mapsButton"
        );

    const errorElement =
        document.getElementById(
            "error"
        );


    // ========================================
    // Get A's Location
    // ========================================

    function startRequesterLocation() {

        if (
            !navigator.geolocation
        ) {

            console.log(
                "Geolocation not supported"
            );

            return;
        }


        navigator.geolocation.watchPosition(

            (position) => {

                requesterLocation = {

                    latitude:
                        position.coords.latitude,

                    longitude:
                        position.coords.longitude,
                };


                console.log(
                    "A location:",
                    requesterLocation
                );


                updateMapsButton();
            },


            (error) => {

                console.log(
                    "A location error:",
                    error.message
                );
            },


            {
                enableHighAccuracy: true,

                maximumAge: 5000,

                timeout: 10000,
            }
        );
    }


    // ========================================
    // Create Request
    // ========================================

    async function createRequest() {

        errorElement.innerText = "";


        try {

            const response =
                await fetch(
                    `${BASE_URL}/location-request`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",
                        },

                        body: JSON.stringify({}),
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message
                );
            }


            requestId =
                data.requestId;


            shareUrlElement.innerText =
                data.shareUrl;


            shareCard.style.display =
                "block";


            locationCard.style.display =
                "block";


            statusElement.innerText =
                "Waiting for the person to share their location...";


            socket.emit(
                "join-request",
                {
                    requestId,

                    role: "requester",
                }
            );


            startRequesterLocation();


            document.getElementById(
                "requestButton"
            ).style.display =
                "none";


        } catch (error) {

            console.error(
                error
            );


            errorElement.innerText =
                error.message;
        }
    }


    // ========================================
    // Copy Link
    // ========================================

    async function copyLink() {

        await navigator.clipboard.writeText(
            shareUrlElement.innerText
        );


        document.getElementById(
            "copyButton"
        ).innerText =
            "Copied ✓";
    }


    // ========================================
    // Location Update from B
    // ========================================

    socket.on(
        "location-update",
        (location) => {

            console.log(
                "B location:",
                location
            );


            latestLocation =
                location;


            locationInfo.style.display =
                "block";


            document.getElementById(
                "latitude"
            ).innerText =
                location.latitude.toFixed(6);


            document.getElementById(
                "longitude"
            ).innerText =
                location.longitude.toFixed(6);


            document.getElementById(
                "updatedAt"
            ).innerText =
                new Date(
                    location.updatedAt
                ).toLocaleTimeString();


            statusElement.innerText =
                "🟢 Live location is active";


            updateMapsButton();
        }
    );


    // ========================================
    // Sharing Started
    // ========================================

    socket.on(
        "sharing-started",
        () => {

            statusElement.innerText =
                "🟢 Live location is active";
        }
    );


    // ========================================
    // Sharing Stopped
    // ========================================

    socket.on(
        "sharing-stopped",
        (data) => {

            statusElement.innerText =
                "🔴 Location sharing stopped";


            if (data.location) {

                latestLocation =
                    data.location;

                updateMapsButton();
            }
        }
    );


    // ========================================
    // Sharing Disconnected
    // ========================================

    socket.on(
        "sharing-disconnected",
        (data) => {

            statusElement.innerText =
                "⚠️ Location sharing disconnected";


            if (data.location) {

                latestLocation =
                    data.location;

                updateMapsButton();
            }
        }
    );


    // ========================================
    // Request Status
    // ========================================

    socket.on(
        "request-status",
        (data) => {

            console.log(
                "Request status:",
                data
            );


            if (
                data.status ===
                "pending"
            ) {

                statusElement.innerText =
                    "Waiting for location sharing...";
            }


            if (
                data.status ===
                "active"
            ) {

                statusElement.innerText =
                    "🟢 Live location is active";
            }


            if (
                data.status ===
                "stopped"
            ) {

                statusElement.innerText =
                    "🔴 Location sharing stopped";
            }


            if (
                data.status ===
                "disconnected"
            ) {

                statusElement.innerText =
                    "⚠️ Location sharing disconnected";
            }


            if (data.location) {

                latestLocation =
                    data.location;

                locationInfo.style.display =
                    "block";


                document.getElementById(
                    "latitude"
                ).innerText =
                    data.location.latitude.toFixed(6);


                document.getElementById(
                    "longitude"
                ).innerText =
                    data.location.longitude.toFixed(6);


                document.getElementById(
                    "updatedAt"
                ).innerText =
                    new Date(
                        data.location.updatedAt
                    ).toLocaleTimeString();


                updateMapsButton();
            }
        }
    );


    // ========================================
    // Google Maps Button
    // ========================================

    function updateMapsButton() {

        if (
            requesterLocation &&
            latestLocation
        ) {

            mapsButton.style.display =
                "block";

        } else {

            mapsButton.style.display =
                "none";
        }
    }


    // ========================================
    // Open Google Maps Directions
    // ========================================

    function openGoogleMaps() {

        if (
            !requesterLocation ||
            !latestLocation
        ) {

            errorElement.innerText =
                "A and B locations are not available yet.";

            return;
        }


        const origin =
            `${requesterLocation.latitude},${requesterLocation.longitude}`;


        const destination =
            `${latestLocation.latitude},${latestLocation.longitude}`;


        const mapsUrl =
            `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}`;


        window.open(
            mapsUrl,
            "_blank"
        );
    }


    // ========================================
    // Socket Errors
    // ========================================

    socket.on(
        "request-error",
        (data) => {

            errorElement.innerText =
                data.message;
        }
    );

</script>

</body>

</html>
