
<!DOCTYPE html>

<html>

<head>

    <title>WhereNow - Live Location</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #map {
            width: 100%;
            height: 500px;
            margin-top: 20px;
            display: none;
        }

        #shareSection {
            display: none;
        }

    </style>

</head>


<body>

    <h2>WhereNow</h2>

    <p>
        Request someone's live location.
    </p>


    <button onclick="createRequest()">
        Create Location Request
    </button>


    <p id="status">
        Ready.
    </p>


    <div id="shareSection">

        <p>
            Send this link to the person:
        </p>

        <input
            id="shareUrl"
            type="text"
            readonly
            style="width: 400px;"
        >

    </div>


    <!-- Live Map -->

    <div id="map"></div>


    <!-- Leaflet JS -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- Socket.IO -->

    <script src="/socket.io/socket.io.js"></script>


    <script>

        const BASE_URL =
            window.location.origin;


        const statusElement =
            document.getElementById(
                "status"
            );


        const shareSection =
            document.getElementById(
                "shareSection"
            );


        const shareUrlInput =
            document.getElementById(
                "shareUrl"
            );


        const mapElement =
            document.getElementById(
                "map"
            );


        // ========================================
        // Map
        // ========================================

        let map = null;

        let marker = null;


        function initializeMap(
            latitude,
            longitude
        ) {

            if (map) {
                return;
            }


            mapElement.style.display =
                "block";


            map =
                L.map("map")
                    .setView(
                        [
                            latitude,
                            longitude
                        ],
                        16
                    );


            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    maxZoom: 19,

                    attribution:
                        "&copy; OpenStreetMap contributors"
                }
            ).addTo(map);


            marker =
                L.marker(
                    [
                        latitude,
                        longitude
                    ]
                )
                .addTo(map)
                .bindPopup(
                    "B's Location"
                )
                .openPopup();

        }


        // ========================================
        // Update Marker
        // ========================================

        function updateMap(
            latitude,
            longitude
        ) {

            initializeMap(
                latitude,
                longitude
            );


            marker.setLatLng(
                [
                    latitude,
                    longitude
                ]
            );


            map.panTo(
                [
                    latitude,
                    longitude
                ]
            );

        }


        // ========================================
        // Create Request
        // ========================================

        async function createRequest() {

            statusElement.innerText =
                "Creating location request...";


            try {

                const response =
                    await fetch(
                        `${BASE_URL}/location-request`,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({})

                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "Create request response:",
                    data
                );


                if (!response.ok) {

                    statusElement.innerText =
                        data.message;

                    return;

                }


                const requestId =
                    data.requestId;


                const shareUrl =
                    `${BASE_URL}/?requestId=${requestId}`;


                shareUrlInput.value =
                    shareUrl;


                shareSection.style.display =
                    "block";


                statusElement.innerText =
                    "Request created. Waiting for location...";


                connectToRequest(
                    requestId
                );

            }

            catch (error) {

                console.error(
                    "Request error:",
                    error
                );


                statusElement.innerText =
                    "Something went wrong.";

            }

        }


        // ========================================
        // Connect A
        // ========================================

        function connectToRequest(
            requestId
        ) {

            const socket =
                io(BASE_URL);


            socket.on(
                "connect",
                () => {

                    console.log(
                        "A connected:",
                        socket.id
                    );


                    socket.emit(
                        "join-request",
                        requestId
                    );


                    console.log(
                        "A joined request:",
                        requestId
                    );

                }
            );


            // ========================================
            // Existing Location
            // ========================================

            socket.on(
                "request-status",
                (data) => {

                    console.log(
                        "Current request status:",
                        data
                    );


                    if (data.location) {

                        showLocation(
                            data.location
                        );

                    }

                }
            );


            // ========================================
            // LIVE Location
            // ========================================

            socket.on(
                "location-update",
                (location) => {

                    console.log(
                        "B's live location:",
                        location
                    );


                    showLocation(
                        location
                    );

                }
            );


            socket.on(
                "request-error",
                (data) => {

                    console.error(
                        "Request error:",
                        data
                    );


                    statusElement.innerText =
                        data.message;

                }
            );


            socket.on(
                "connect_error",
                (error) => {

                    console.error(
                        "Socket error:",
                        error
                    );


                    statusElement.innerText =
                        "Socket connection failed.";

                }
            );

        }


        // ========================================
        // Show Location
        // ========================================

        function showLocation(
            location
        ) {

            statusElement.innerText =
                `Live location: ${location.latitude}, ${location.longitude}`;


            updateMap(
                location.latitude,
                location.longitude
            );

        }

    </script>

</body>

</html>
